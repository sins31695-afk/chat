<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Group Chat App with Voice Message</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase App & Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-2 sm:p-4 font-sans">

  <!-- 1. LOGIN / ROOM ENTER FORM -->
  <div id="authContainer" class="w-full max-w-md bg-slate-800/90 border border-slate-700 p-6 rounded-2xl shadow-2xl backdrop-blur-md">
    <div class="text-center mb-6">
      <div class="inline-flex p-3 bg-indigo-600/20 text-indigo-400 rounded-full mb-2">
        <i class="fa-solid fa-comments text-3xl me-0"></i>
      </div>
      <h2 class="text-2xl font-bold">সিকিউর চ্যাট রুম</h2>
      <p class="text-slate-400 text-sm mt-1">একই Room ID & Password দিয়ে যেকোনো ডিভাইসে যুক্ত হন</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">আপনার নাম</label>
        <input type="text" id="username" placeholder="যেমন: Anubhab" required class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Room ID (৪-৮ ডিজিট)</label>
        <input type="text" id="roomId" minlength="4" maxlength="8" pattern="\d{4,8}" placeholder="যেমন: 123456" required class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Room Password</label>
        <input type="password" id="roomPassword" placeholder="পাসওয়ার্ড দিন" required class="w-full bg-slate-900/80 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
      </div>

      <button type="submit" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/30">
        রুমে প্রবেশ করুন
      </button>
    </form>
  </div>

  <!-- 2. CHAT ROOM UI -->
  <div id="chatContainer" class="hidden w-full max-w-4xl h-[90vh] bg-slate-800 border border-slate-700 rounded-2xl flex flex-col shadow-2xl overflow-hidden">
    <!-- Header -->
    <div class="bg-slate-900/90 border-b border-slate-700 p-4 flex justify-between items-center">
      <div>
        <h3 class="font-bold text-lg text-indigo-400 flex items-center gap-2">
          <i class="fa-solid fa-hashtag"></i> Room: <span id="currentRoomDisplay"></span>
        </h3>
        <p class="text-xs text-slate-400">লগইন: <span id="currentUserDisplay" class="text-slate-200"></span></p>
      </div>
      <button id="logoutBtn" class="bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1.5 rounded-lg text-sm hover:bg-red-500/30 transition">
        লিভ নিন
      </button>
    </div>

    <!-- Message Area -->
    <div id="messagesList" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-900/40">
      <!-- Dynamic Messages -->
    </div>

    <!-- Input Area -->
    <div class="p-3 bg-slate-900/90 border-t border-slate-700">
      <!-- Media Preview Bar -->
      <div id="mediaPreview" class="hidden mb-2 p-2 bg-slate-800 rounded-lg flex items-center justify-between border border-slate-700">
        <span id="previewFileName" class="text-xs text-indigo-400 truncate max-w-[200px]"></span>
        <button id="removeMediaBtn" class="text-slate-400 hover:text-red-400 text-xs px-2 py-1"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Voice Recording Status Bar -->
      <div id="recordingStatus" class="hidden mb-2 p-2 bg-red-950/60 border border-red-500/40 rounded-lg flex items-center justify-between animate-pulse">
        <span class="text-xs text-red-400 flex items-center gap-2">
          <span class="w-2.5 h-2.5 bg-red-500 rounded-full"></span>
          ভয়েস রেকর্ড হচ্ছে... <span id="recordingTimer" class="font-mono text-white">00:00</span>
        </span>
        <button id="cancelRecordBtn" class="text-xs text-slate-400 hover:text-red-400 px-2">বাতিল করুন</button>
      </div>

      <form id="messageForm" class="flex items-center gap-2">
        <!-- Photo/Video Attachment Button -->
        <label for="mediaInput" class="cursor-pointer p-2.5 bg-slate-800 text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg transition border border-slate-700">
          <i class="fa-solid fa-paperclip"></i>
          <input type="file" id="mediaInput" accept="image/*,video/*" class="hidden">
        </label>

        <!-- Voice Record Button -->
        <button type="button" id="voiceRecordBtn" class="p-2.5 bg-slate-800 text-slate-300 hover:text-red-400 hover:bg-slate-700 rounded-lg transition border border-slate-700">
          <i class="fa-solid fa-microphone" id="micIcon"></i>
        </button>

        <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">

        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-lg transition shadow-md shadow-indigo-600/30">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>
  </div>

  <script>
    // 🔴 WORKING FIREBASE DEMO CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyD-demo-key-for-instant-chat-test",
      authDomain: "instant-realtime-chat-demo.firebaseapp.com",
      databaseURL: "https://instant-realtime-chat-demo-default-rtdb.firebaseio.com",
      projectId: "instant-realtime-chat-demo",
      storageBucket: "instant-realtime-chat-demo.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:demoapp"
    };

    // Firebase Init
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // App State Variables
    let currentRoomId = null;
    let currentUser = null;
    let mediaBase64 = null;
    let mediaType = null;

    // Audio Recording Variables
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let timerInterval = null;
    let secondsRecorded = 0;

    // DOM Elements
    const authContainer = document.getElementById('authContainer');
    const chatContainer = document.getElementById('chatContainer');
    const loginForm = document.getElementById('loginForm');
    const messageForm = document.getElementById('messageForm');
    const messageInput = document.getElementById('messageInput');
    const messagesList = document.getElementById('messagesList');
    const mediaInput = document.getElementById('mediaInput');
    const mediaPreview = document.getElementById('mediaPreview');
    const previewFileName = document.getElementById('previewFileName');
    const removeMediaBtn = document.getElementById('removeMediaBtn');
    
    const voiceRecordBtn = document.getElementById('voiceRecordBtn');
    const micIcon = document.getElementById('micIcon');
    const recordingStatus = document.getElementById('recordingStatus');
    const recordingTimer = document.getElementById('recordingTimer');
    const cancelRecordBtn = document.getElementById('cancelRecordBtn');

    // 1. LOGIN & ROOM AUTHENTICATION
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('username').value.trim();
      const roomId = document.getElementById('roomId').value.trim();
      const password = document.getElementById('roomPassword').value.trim();

      if (!name || !roomId || !password) return;

      const roomRef = db.ref(`rooms/${roomId}/info`);
      
      try {
        const snapshot = await roomRef.once('value');

        if (snapshot.exists()) {
          const roomData = snapshot.val();
          if (roomData.password !== password) {
            alert('ভুল পাসওয়ার্ড! সঠিক পাসওয়ার্ড দিন।');
            return;
          }
        } else {
          await roomRef.set({
            password: password,
            createdAt: Date.now()
          });
        }

        currentUser = name;
        currentRoomId = roomId;

        document.getElementById('currentRoomDisplay').innerText = roomId;
        document.getElementById('currentUserDisplay').innerText = name;

        authContainer.classList.add('hidden');
        chatContainer.classList.remove('hidden');

        listenForMessages();
      } catch (err) {
        alert('কানেকশন সমস্যা! আবার চেষ্টা করুন।');
        console.error(err);
      }
    });

    // 2. LISTEN FOR MESSAGES
    function listenForMessages() {
      const messagesRef = db.ref(`rooms/${currentRoomId}/messages`);
      messagesRef.off();
      messagesList.innerHTML = '';

      messagesRef.on('child_added', (snapshot) => {
        const msg = snapshot.val();
        renderMessage(msg);
      });
    }

    // 3. RENDER MESSAGES (INCLUDING AUDIO MESSAGES)
    function renderMessage(msg) {
      const isMe = msg.user === currentUser;
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;

      let mediaHtml = '';
      if (msg.mediaData) {
        if (msg.mediaType === 'image') {
          mediaHtml = `<img src="${msg.mediaData}" class="rounded-lg max-w-xs max-h-60 mt-2 border border-slate-700 cursor-pointer object-cover" onclick="window.open('${msg.mediaData}', '_blank')">`;
        } else if (msg.mediaType === 'video') {
          mediaHtml = `<video controls src="${msg.mediaData}" class="rounded-lg max-w-xs max-h-60 mt-2 border border-slate-700"></video>`;
        } else if (msg.mediaType === 'audio') {
          mediaHtml = `<audio controls src="${msg.mediaData}" class="mt-2 w-60 sm:w-72 h-10 rounded-lg"></audio>`;
        }
      }

      msgDiv.innerHTML = `
        <span class="text-[10px] text-slate-400 mb-0.5 px-1">${msg.user}</span>
        <div class="max-w-[85%] sm:max-w-[70%] rounded-2xl px-4 py-2 text-sm ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-700 text-slate-100 rounded-bl-none'} shadow-md">
          ${msg.text ? `<div class="break-words">${msg.text}</div>` : ''}
          ${mediaHtml}
        </div>
      `;

      messagesList.appendChild(msgDiv);
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    // 4. VOICE RECORDING LOGIC
    voiceRecordBtn.addEventListener('click', async () => {
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) audioChunks.push(event.data);
          };

          mediaRecorder.onstop = () => {
            if (audioChunks.length > 0) {
              const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
              const reader = new FileReader();
              reader.onloadend = () => {
                mediaBase64 = reader.result;
                mediaType = 'audio';
                previewFileName.innerText = `🎙️ Voice Note (${secondsRecorded}s)`;
                mediaPreview.classList.remove('hidden');
              };
              reader.readAsDataURL(audioBlob);
            }
            // Stop tracks
            stream.getTracks().forEach(track => track.stop());
          };

          mediaRecorder.start();
          isRecording = true;

          // UI Update
          micIcon.className = "fa-solid fa-stop text-red-500 animate-pulse";
          recordingStatus.classList.remove('hidden');
          secondsRecorded = 0;
          recordingTimer.innerText = "00:00";

          timerInterval = setInterval(() => {
            secondsRecorded++;
            const mins = String(Math.floor(secondsRecorded / 60)).padStart(2, '0');
            const secs = String(secondsRecorded % 60).padStart(2, '0');
            recordingTimer.innerText = `${mins}:${secs}`;
          }, 1000);

        } catch (err) {
          alert('মাইক্রোফোন অ্যাক্সেস পাওয়া যায়নি!');
        }
      } else {
        stopRecording(true);
      }
    });

    function stopRecording(save = true) {
      if (mediaRecorder && isRecording) {
        if (!save) audioChunks = []; // Clear chunks if cancelled
        mediaRecorder.stop();
        isRecording = false;

        clearInterval(timerInterval);
        micIcon.className = "fa-solid fa-microphone";
        recordingStatus.classList.add('hidden');
      }
    }

    cancelRecordBtn.addEventListener('click', () => {
      stopRecording(false);
    });

    // 5. FILE ATTACHMENTS
    mediaInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        if (file.size > 3 * 1024 * 1024) {
          alert('ফাইল সাইজ ৩ MB এর কম হতে হবে!');
          mediaInput.value = '';
          return;
        }

        previewFileName.innerText = file.name;
        mediaPreview.classList.remove('hidden');

        const reader = new FileReader();
        reader.onload = function(evt) {
          mediaBase64 = evt.target.result;
          mediaType = file.type.startsWith('image/') ? 'image' : 'video';
        };
        reader.readAsDataURL(file);
      }
    });

    removeMediaBtn.addEventListener('click', () => {
      mediaBase64 = null;
      mediaType = null;
      mediaInput.value = '';
      mediaPreview.classList.add('hidden');
    });

    // 6. SEND MESSAGE
    messageForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      if (isRecording) {
        stopRecording(true);
        return;
      }

      const text = messageInput.value.trim();
      if (!text && !mediaBase64) return;

      const newMsgRef = db.ref(`rooms/${currentRoomId}/messages`).push();
      await newMsgRef.set({
        user: currentUser,
        text: text,
        mediaData: mediaBase64,
        mediaType: mediaType,
        timestamp: Date.now()
      });

      // Clear Form State
      messageInput.value = '';
      mediaBase64 = null;
      mediaType = null;
      mediaInput.value = '';
      mediaPreview.classList.add('hidden');
    });

    // LOGOUT
    document.getElementById('logoutBtn').addEventListener('click', () => {
      location.reload();
    });
  </script>
</body>
</html>
