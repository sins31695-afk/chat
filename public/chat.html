<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Private Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

<div class="chat-container">

    <!-- HEADER -->

    <header class="chat-header">

        <div>

            <h2>💬 Private Chat</h2>

            <span id="deviceStatus">
                Connecting...
            </span>

        </div>

        <button
            id="logoutButton"
            class="logout-button"
        >
            Logout
        </button>

    </header>


    <!-- MESSAGES -->

    <main id="messages"></main>


    <!-- FILE PREVIEW -->

    <div
        id="filePreview"
        class="file-preview"
    ></div>


    <!-- MESSAGE INPUT -->

    <form
        id="messageForm"
        class="message-form"
    >

        <input
            type="file"
            id="fileInput"
            accept="image/*,video/*"
            hidden
        >

        <button
            type="button"
            id="fileButton"
            class="icon-button"
        >
            📎
        </button>


        <input
            id="messageInput"
            type="text"
            placeholder="Write a message..."
            autocomplete="off"
        >


        <button
            type="submit"
            class="send-button"
        >
            Send
        </button>

    </form>

</div>


<!-- SOCKET.IO -->

<script src="/socket.io/socket.io.js"></script>

<!-- OUR JAVASCRIPT -->

<script src="app.js"></script>

</body>

</html>
